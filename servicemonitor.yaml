apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-app-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames: ["demo"]
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - exp-canary
          - exp-bluegreen
  endpoints:
    - port: http
      path: /metrics
      interval: 15s