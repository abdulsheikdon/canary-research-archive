apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: k6-check
  namespace: demo
spec:
  args:
    - name: target-url
    - name: vus
      value: "5"
  metrics:
    - name: k6-load-test
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                containers:
                  - name: k6
                    image: grafana/k6:latest
                    command: ["k6", "run", "--vus", "{{args.vus}}", "--duration", "20s", "-e", "TARGET={{args.target-url}}", "/scripts/loadtest.js"]
                    volumeMounts:
                      - name: script
                        mountPath: /scripts
                volumes:
                  - name: script
                    configMap:
                      name: k6-script
                restartPolicy: Never